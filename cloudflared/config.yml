tunnel: f2b70f47-5ad9-4a55-83ba-d04d3169a06d
credentials-file: C:/Users/Dell/.cloudflared/f2b70f47-5ad9-4a55-83ba-d04d3169a06d.json

# Suppress automatic updates so the tunnel doesn't restart unexpectedly.
no-autoupdate: true

# Ingress rules — first match wins, the wildcard at the end is mandatory.
ingress:
